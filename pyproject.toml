[project]
name = "study-coord"
version = "0.1.0"
description = "Study Coordinator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "nicegui>=3.15.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pandas-stubs~=3.0.3",
    "pydantic[email,timezone]==2.13.5",
    "pytest-asyncio>=1.4.0",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "starlette>=1.6.0",
    "typing-extensions>=4.15.0",
    "validators>=0.35.0",
    "xlsxwriter>=3.2.9",
    "psycopg[binary]>=3.2.4",
    "fastapi>=0.141.1",
    "nicemvvm@git+https://github.com/joaofig/nicemvvm.git",
]


[tool.pytest.ini_options]
python_files = ["test_*.py", "*_test.py", "*_tests.py"]
pythonpath = ["app"]

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.uv.sources]
nicemvvm = { path = "../nicemvvm", editable = true }

